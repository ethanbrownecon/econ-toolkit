site_name: The Econ Toolkit
site_description: Practical technical guides for economics research and analysis.
site_url: https://ethanbrownecon.github.io/econ-toolkit/
repo_name: econ-toolkit
repo_url: https://github.com/ethanbrownecon/econ-toolkit
edit_uri: edit/main/docs/
copyright: >
  © 2026 Ethan Brown · Writing licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> ·
  Code licensed under
  <a href="https://github.com/ethanbrownecon/econ-toolkit/blob/main/LICENSE-CODE">MIT</a>

# MkDocs skips docs/templates/ by default; include it
exclude_docs: |
  !/templates/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/brand/mark.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ethanbrownecon/econ-toolkit

nav:
  - Home: index.md
  - Start here: start-here.md
  - Get set up:
      - VS Code: vscode/README.md
      - Git & GitHub: git-github/README.md
      - Command line: command-line/README.md
      - Markdown: markdown/README.md
  - Templates:
      - Overview: templates/index.md
      - Stata do-file: templates/stata.md
      - R script: templates/r.md
      - Python script: templates/python.md
  - Projects:
      - Overview: projects/index.md
      - "Project 1: Wages and education": projects/wages.md
      - "Project 2: The economy in charts": projects/fred.md
      - "Replication: Drunk driving (RD)": projects/replication-hansen.md
      - "Replication: Stand your ground laws (DiD)": projects/replication-castle.md
      - "Replication: Job training (matching)": projects/replication-lalonde.md
      - "Fun project: Spotify": projects/spotify.md
      - "Fun project: Home advantage": projects/home-advantage.md
  - Data:
      - Datasets: data/datasets.md
      - APIs: data/apis.md
      - Web scraping: data/scraping.md
  - Econometrics:
      - Overview: econometrics/index.md
      - Linear regression: econometrics/ols.md
      - Logit and probit: econometrics/logit.md
      - Fixed and random effects: econometrics/panel.md
      - Instrumental variables: econometrics/iv.md
      - Difference-in-differences: econometrics/did.md
      - Synthetic control and SDID: econometrics/synthetic.md
      - Regression discontinuity: econometrics/rd.md
      - Matching and propensity scores: econometrics/matching.md
      - Glossary: econometrics/glossary.md
  - Coming from:
      - Overview: coming-from/index.md
      - Stata: coming-from/stata.md
      - Excel: coming-from/excel.md
      - R: coming-from/r.md
  - Guides:
      - LaTeX: latex/README.md
      - R: r/README.md
      - Stata: stata/README.md
      - Python: python/README.md
      - SQL: sql/README.md
      - Data visualization: data-viz/README.md
      - Machine learning: machine-learning/README.md
      - Reproducible research: reproducible-research/README.md
  - Resources: resources/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.snippets:
      base_path: [docs/templates/files]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
