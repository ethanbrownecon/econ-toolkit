site_name: Econ Toolkit
site_description: Practical technical guides for economics research and analysis.
site_url: https://ethanbrownecon.github.io/econ-toolkit/
repo_name: econ-toolkit
repo_url: https://github.com/ethanbrownecon/econ-toolkit
edit_uri: edit/main/docs/

# MkDocs skips docs/templates/ by default; include it
exclude_docs: |
  !/templates/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chart-timeline-variant-shimmer
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ethanbrownecon/econ-toolkit

nav:
  - Home: index.md
  - Get set up:
      - VS Code: vscode/README.md
      - Git & GitHub: git-github/README.md
      - Command line: command-line/README.md
      - Markdown: markdown/README.md
  - Templates:
      - Overview: templates/index.md
      - Stata do-file: templates/stata.md
      - R script: templates/r.md
      - Python script: templates/python.md
  - Coming from:
      - Overview: coming-from/index.md
      - Stata: coming-from/stata.md
      - Excel: coming-from/excel.md
      - R: coming-from/r.md
  - Guides:
      - LaTeX: latex/README.md
      - R: r/README.md
      - Stata: stata/README.md
      - Python: python/README.md
      - SQL: sql/README.md
      - Data visualization: data-viz/README.md
      - Machine learning: machine-learning/README.md
      - Reproducible research: reproducible-research/README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.snippets:
      base_path: [docs/templates/files]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
