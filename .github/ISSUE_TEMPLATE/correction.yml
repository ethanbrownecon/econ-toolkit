name: Correction
description: Report a mistake, broken link or confusing explanation
title: "[Correction]: "
labels: ["correction"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page with the problem
      placeholder: https://ethanbrownecon.github.io/econ-toolkit/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the text or code, and say what is wrong with it
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. What should it say instead?
